<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
<link rel="stylesheet" href="./styles.css">
<title>Marseille Drive</title>
</head>
<body>
<div id="map"></div>
<div class="hud">
<section class="card top"><div><div class="brand">MARSEILLE DRIVE</div><div class="muted">BETA 1 · PILOTE MARSEILLE 10e</div></div><div class="speed"><span id="speed">--</span> <small>km/h</small></div></section>
<section class="card stats"><div><b id="lane">—</b><small>VOIE</small></div><div><b id="conf">—</b><small>CONFIANCE</small></div><div><b id="road">—</b><small>ROUTE</small></div><div><b id="signal">—</b><small>FEU</small></div></section>
<div class="buttons"><button id="follow" class="card">🎯 Suivre</button><button id="compass" class="card">🧭 Cap</button><button id="camera" class="card">📷 Vision</button><button id="demo" class="card">▶ Démo</button></div>
<div id="search" class="card search"><div class="muted">DESTINATION</div><div class="muted">Tape la carte pour choisir une destination, puis l'itinéraire sera calculé.</div><button id="closeRoute">Fermer</button></div>
<div id="cameraPanel" class="card camera" hidden><video id="video" autoplay playsinline muted></video><div class="muted">Caméra locale. Détection automatique à venir.</div></div>
<section class="card bottom"><div class="muted">NAVIGATION</div><div id="instruction" class="instruction">Initialisation…</div><div id="detail" class="muted">Chargement du pilote Marseille 10e.</div><div id="advice" class="advice">Voie en attente</div></section>
</div>
<div id="car"></div>
</body>
<script type="module" src="./app.js"></script>
</html>
